    <style>
        :root {
            --sidebar-width: 300px;
            --red-accent: #e63946;
            --blue-pub: #2196f3;
            --purple-curto: #9b51e0;
            --yellow-teatro: #f2c94c;
            --green-pod: #27ae60;    
            --orange-yt: #ff5722;    
            --grey-doc: #607d8b;     
            --white-clean: #ffffff;
            --dark-bg: #0f1113;
            --bg-foco: #0f1113;
        }

        body { 
            background: var(--dark-bg) url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059&auto=format&fit=crop'); 
            background-size: cover; background-attachment: fixed; background-blend-mode: multiply;
            font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; color: var(--white-clean); overflow: hidden;
        }

        /* === TELAS === */
        #tela-login, #tela-inicial, #tela-editor { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #tela-inicial, #tela-editor { display: none; }

        #tela-login { position: fixed; top: 0; left: 0; background: var(--dark-bg); z-index: 9999; }
        .login-box { background: rgba(255,255,255,0.05); padding: 50px 70px; border-radius: 40px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        
        /* Ajuste de opacidade na área da logo */
        .logo-principal { width: 240px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.8); padding: 15px; border-radius: 15px; }
        .logo-sidebar { width: 150px; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 10px; }

        /* === BARRA LATERAL === */
        aside {
            width: var(--sidebar-width); background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 40px 25px; z-index: 1000;
        }
        .logo-container { display: flex; align-items: center; gap: 15px; margin-bottom: 50px; }
        .btn-voltar-seta { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: 0.3s; flex-shrink: 0;}
        .btn-voltar-seta:hover { background: var(--red-accent); }

        .lista-projetos { flex-grow: 1; overflow-y: auto; }
        .item-projeto-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.03); cursor: pointer;
            border-left: 6px solid #444; transition: 0.2s;
        }
        .item-projeto-wrapper.cinema { border-left-color: var(--red-accent); }
        .item-projeto-wrapper.publicidade { border-left-color: var(--blue-pub); }
        .item-projeto-wrapper.curto { border-left-color: var(--purple-curto); }
        .item-projeto-wrapper.teatro { border-left-color: var(--yellow-teatro); }
        .item-projeto-wrapper.podcast { border-left-color: var(--green-pod); }
        .item-projeto-wrapper.youtube { border-left-color: var(--orange-yt); }
        .item-projeto-wrapper.documentario { border-left-color: var(--grey-doc); }
        .item-projeto-wrapper.ativo { background: rgba(255, 255, 255, 0.1); }

        #btnInstalar { display: none; background: white; color: black; padding: 12px; border-radius: 50px; border: none; cursor: pointer; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; margin-top: 20px; width: 100%; }

        /* === EDITOR (FUNDO ESCURO COM FOLHA A4 BRANCA) === */
        #tela-editor { justify-content: flex-start; overflow-y: auto; position: relative; background: var(--bg-foco); }
        
        .toolbar { 
            width: 210mm; 
            background: white; 
            padding: 15px 30px; 
            border-radius: 50px; 
            display: flex; 
            gap: 15px; 
            color: #333; 
            margin: 20px auto 0 auto; 
            position: sticky; 
            top: 20px; 
            z-index: 10; 
            align-items: center; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }
        
        .folha-roteiro { 
            background: #ffffff; 
            color: black; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 12pt; 
            width: 210mm; 
            min-height: 297mm; 
            height: auto; 
            flex-shrink: 0; 
            margin: 30px auto 100px auto; 
            padding: 25mm; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
            outline: none; 
            white-space: pre-wrap; 
            box-sizing: border-box;
        }

        /* Correção das colunas duplas para compatibilidade (Sem ultrapassar o A4) */
        .f-publicidade, .f-documentario { width: 100%; display: flex; flex-wrap: wrap; gap: 20px; } 
        .coluna-video { padding-right: 20px; border-right: 1px solid #ccc; word-break: break-word; }
        .coluna-audio { padding-left: 20px; word-break: break-word; }
        .f-curto { width: 150mm; } 
        
        .personagem { text-align: center; text-transform: uppercase; margin-top: 25px; font-weight: bold; display: block; }
        .parenteses { text-align: center; margin-left: 20%; margin-right: 20%; font-style: italic; display: block; }
        .dialogo { margin: 0 15% 10px 15%; display: block; }
        .acao { margin-bottom: 12px; display: block; }
        .transicao { text-align: right; text-transform: uppercase; margin-top: 15px; margin-bottom: 15px; font-weight: bold; display: block;}

        /* === DASHBOARD === */
        .opcoes-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-top: 20px; width: 100%; max-width: 650px; padding-bottom: 20px; }
        
        .cartao { 
            background: rgba(255, 255, 255, 0.03); border-radius: 20px; cursor: pointer; 
            border: 2px solid rgba(255,255,255,0.05); text-align: center; transition: all 0.4s ease-in-out; 
            font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; color: #ccc;
            width: 160px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .cartao img { width: 65px; height: auto; margin-bottom: 15px; transition: transform 0.3s ease; }
        
        .cartao:hover { transform: translateY(-5px); color: white;}
        .cartao:hover img { transform: scale(1.15); } 

        #card-cinema:hover, #card-cinema.selecionado { border-color: var(--red-accent); box-shadow: 0 0 30px 2px rgba(230, 57, 70, 0.5); background: rgba(230, 57, 70, 0.1); color: white;}
        #card-publicidade:hover, #card-publicidade.selecionado { border-color: var(--blue-pub); box-shadow: 0 0 30px 2px rgba(33, 150, 243, 0.5); background: rgba(33, 150, 243, 0.1); color: white;}
        #card-curto:hover, #card-curto.selecionado { border-color: var(--purple-curto); box-shadow: 0 0 30px 2px rgba(155, 81, 224, 0.5); background: rgba(155, 81, 224, 0.1); color: white;}
        #card-teatro:hover, #card-teatro.selecionado { border-color: var(--yellow-teatro); box-shadow: 0 0 30px 2px rgba(242, 201, 76, 0.5); background: rgba(242, 201, 76, 0.1); color: white;}
        #card-podcast:hover, #card-podcast.selecionado { border-color: var(--green-pod); box-shadow: 0 0 30px 2px rgba(39, 174, 96, 0.5); background: rgba(39, 174, 96, 0.1); color: white;}
        #card-youtube:hover, #card-youtube.selecionado { border-color: var(--orange-yt); box-shadow: 0 0 30px 2px rgba(255, 87, 34, 0.5); background: rgba(255, 87, 34, 0.1); color: white;}
        #card-documentario:hover, #card-documentario.selecionado { border-color: var(--grey-doc); box-shadow: 0 0 30px 2px rgba(96, 125, 139, 0.5); background: rgba(96, 125, 139, 0.1); color: white;}
        
        .btn-pill { padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 700; transition: 0.3s; }
        .btn-red { background: var(--red-accent); color: white; }

        @media print {
            .toolbar, aside { display: none !important; }
            #tela-editor { background: white; }
            .folha-roteiro { box-shadow: none; border: none; margin: 0; padding: 0; }
        }
    </style>

<body>
<nav class="cc-main-nav"><a href="/" title="Abrir decupagens">▦ Decupagem</a><a href="/roteiros.html" class="selected" title="Abrir roteiros">✎ Roteiros</a></nav>

    <div id="tela-login">
        <div class="login-box">
            <div class="cc-typographic-brand">CENACURTA<small>ESTÚDIO DE ROTEIROS</small></div>
            <p style="letter-spacing: 2px; font-weight: 200; margin-bottom: 25px; color: #ccc;">ESTÚDIO DIGITAL</p>
            
            <input type="text" id="nome-usuario-input" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 50px; color: white; width: 280px; text-align: center; outline: none; margin-bottom: 20px; font-size: 0.9rem;" placeholder="Como gostaria de ser chamado(a) ?">
            <button class="btn-pill btn-red" style="width: 100%; padding: 15px;" onclick="criarConta()">Começar a Criar</button>
        </div>
    </div>

    <aside>
        <div class="logo-container">
            <button class="btn-voltar-seta" onclick="voltarNavegacao()">←</button>
            <div class="cc-typographic-brand cc-side-brand">CENACURTA<small>ESTÚDIO DE ROTEIROS</small></div>
        </div>
        <div style="font-size: 0.8rem; color: white; font-weight: 600; margin-bottom: 20px; letter-spacing: 1px;">ARQUIVOS RECENTES</div>

            <div class="opcoes-grid">
                <div class="cartao" id="card-cinema" onclick="selecionarModo('cinema')">
                    <img src="https://i.postimg.cc/WbTpXzLm/cinema-png.png" alt="Cinema">CINEMA

    <script>
        // Instalacao PWA removida: nao havia manifest ou service worker publicados.

        let idAtual = null;
        let modoAtivo = null;
        let deferredPrompt;

        const guias = {
            cinema: `<b>[MASTER SCENE FORMAT]</b>\n<div class="acao">INT. NOME DO LOCAL - DIA\n\nDescreva a ação e o que vemos na cena de forma clara e objetiva.</div>\n<div class="personagem">PERSONAGEM</div>\n<div class="parenteses">(sarcástico)</div>\n<div class="dialogo">O diálogo do personagem entra aqui, formatado centralizado.</div>\n<div class="transicao">CORTE PARA:</div>`,
            publicidade: `<table style="width: 100%; border-collapse: collapse; table-layout: fixed;"><tr><td class="coluna-video" style="width: 50%; vertical-align: top;"><b>VÍDEO</b><hr><br>[00:00 - 00:05]<br>Descreva as imagens, movimentos de câmera e GC.</td><td class="coluna-audio" style="width: 50%; vertical-align: top;"><b>ÁUDIO</b><hr><br><b>LOCUTOR (VO):</b><br>Texto falado pelo locutor.<br><br><b>[SFX]:</b> Efeito sonoro.</td></tr></table>`,
            curto: `<div style="text-align:center; font-weight:bold; background:var(--red-accent); color:white; padding:5px; border-radius:5px;">HOOK (0-3s)</div>\n<div class="acao">Ação visual impactante para prender a atenção.</div>\n<div class="dialogo">"Você não vai acreditar no que aconteceu..."</div><br>\n<div style="text-align:center; font-weight:bold; background:#333; color:white; padding:5px; border-radius:5px;">RETENÇÃO (Corpo)</div>\n<div class="acao">Desenvolvimento do conteúdo com B-Roll rápido.</div><br>\n<div style="text-align:center; font-weight:bold; background:var(--blue-pub); color:white; padding:5px; border-radius:5px;">CTA (Chamada)</div>\n<div class="dialogo">"Siga para a parte 2!"</div>`,
            teatro: `<div class="acao"><i>(As luzes acendem. O palco revela uma sala. PERSONAGEM A entra.)</i></div>\n<div class="personagem">PERSONAGEM A</div>\n<div class="dialogo"><i>(Ajeitando o casaco)</i><br>Finalmente cheguei.</div>`,
            podcast: `<div style="border: 2px dashed #ccc; padding: 15px; margin-bottom: 20px;"><b>TEMA DO EPISÓDIO:</b> [Inserir Tema]<br><b>CONVIDADO:</b> [Nome do Convidado]</div>\n<div class="acao"><b>[00:00] [MÚSICA DE INTRODUÇÃO - FADE IN]</b></div>\n<div class="personagem">HOST</div>\n<div class="dialogo">Olá e bem-vindos a mais um episódio...</div>\n<div class="acao"><b>[00:45] [SFX: Transição]</b></div>\n<div class="acao"><b>[01:00] TÓPICO 1:</b> Discussão sobre o assunto principal.</div>`,
            youtube: `<div class="acao"><b>[TÍTULO DO VÍDEO]:</b> Uma ideia magnética aqui.</div>\n<div class="acao"><b>[A-ROLL]:</b> (Apresentador para a câmera)</div>\n<div class="dialogo">Fala galera! Hoje vamos falar sobre...</div>\n<div class="acao"><b>[B-ROLL]:</b> (Inserir imagens de cobertura sobre o tema enquanto a narração continua)</div>\n<div class="acao"><b>[PATROCÍNIO]:</b> Transição suave para a marca X.</div>`,
            documentario: `<table style="width: 100%; border-collapse: collapse; table-layout: fixed;"><tr><td class="coluna-video" style="width: 50%; vertical-align: top;"><b>IMAGEM / VISUAL</b><hr><br><b>[IMAGEM DE ARQUIVO]</b><br>Fotos antigas da cidade em P&B.<br><br><b>[CABEÇA FALANTE]</b><br>Entrevistado olhando ligeiramente fora da lente.</td><td class="coluna-audio" style="width: 50%; vertical-align: top;"><b>ÁUDIO / TRILHA</b><hr><br><b>[MÚSICA MELANCÓLICA - FADE IN]</b><br><br><b>NARRADOR (VO):</b><br>Tudo começou em meados de 1920...<br><br><b>ENTREVISTADO:</b><br>Nós não tínhamos ideia do que estava por vir.</td></tr></table>`
        };

        function abrirImportacao() {
            document.getElementById('input-importar').click();
        }

        document.getElementById('input-importar').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'txt' || ext === 'md') {
                const reader = new FileReader();
                reader.onload = function(evt) { processarTextoImportado(evt.target.result); };
                reader.readAsText(file);
            } 
            else if (ext === 'docx') {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    mammoth.extractRawText({arrayBuffer: evt.target.result})
                        .then(function(result){ processarTextoImportado(result.value); })
                        .catch(function(err){ alert("Erro ao ler o Word."); });
                };
                reader.readAsArrayBuffer(file);
            } 
            this.value = '';
        });

        function processarTextoImportado(texto) {
            if (texto.length > 400000) { alert('Arquivo muito grande para importar.'); return; }
            const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const editor=document.getElementById('editor');
            const seguro=texto.replace(/\r\n?/g,'\n').split('\n').map(l=>l.trim()?'<div class="acao">'+escapeHtml(l)+'</div>':'<br>').join('');
            editor.insertAdjacentHTML('beforeend','<br>'+seguro);
            solicitarSalvamento();
        }

        function criarConta() {
            const nome = document.getElementById('nome-usuario-input').value;
            if (nome.trim()) {
                localStorage.setItem('nome_usuario', nome);
                location.reload();
            }
        }

        function voltarNavegacao() {
            if (document.getElementById('tela-editor').style.display === 'flex') {
                document.getElementById('tela-editor').style.display = 'none';
                document.getElementById('tela-inicial').style.display = 'flex';
                idAtual = null;
            } else {
                document.getElementById('tela-inicial').style.display = 'none';
                document.getElementById('tela-login').style.display = 'flex';
            }
        }

        function selecionarModo(tipo) {
            modoAtivo = tipo;
            document.querySelectorAll('.cartao').forEach(c => c.classList.remove('selecionado'));
            document.getElementById('card-' + tipo).classList.add('selecionado');
            document.getElementById('btn-iniciar').style.display = 'block';
        }

        function confirmarNovo() {
            document.getElementById('tela-inicial').style.display = 'none';
            document.getElementById('tela-editor').style.display = 'flex';
            idAtual = null;
            const ed = document.getElementById('editor');
            ed.className = 'folha-roteiro f-' + modoAtivo;
            ed.innerHTML = guias[modoAtivo];
            document.getElementById('input-titulo').value = "NOVO " + modoAtivo.toUpperCase();
        }

        document.getElementById('editor').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                let node = window.getSelection().anchorNode.parentElement;
                node.className = (node.className === 'personagem') ? 'acao' : 'personagem';
            }
            if (e.key === 'Enter') {
                setTimeout(() => {
                    let node = window.getSelection().anchorNode.parentElement;
                    if (node.previousElementSibling?.className === 'personagem') node.className = 'dialogo';
                    else if (node.previousElementSibling?.className === 'dialogo') node.className = 'acao';
                }, 10);
            }
        });

        function salvarNoBanco() {
            const titulo=(document.getElementById('input-titulo').value||'SEM TÍTULO').trim();
            const conteudo=document.getElementById('editor').innerHTML;
            const id=idAtual||'proj_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
            let bd={};try{bd=JSON.parse(localStorage.getItem('meu_roteiro_bd')||'{}');}catch(e){console.warn(e)}
            bd[id]={titulo,conteudo,classe:document.getElementById('editor').className,tipo:modoAtivo||'cinema',atualizado:Date.now()};
            try{localStorage.setItem('meu_roteiro_bd',JSON.stringify(bd));idAtual=id;atualizarLista();const ind=document.getElementById('cc-save-indicator');if(ind)ind.textContent='● Salvo';}
            catch(e){console.warn(e);alert('Não foi possível salvar. Faça um backup dos seus roteiros.');}
        }
        let timerSalvamento=null;
        function solicitarSalvamento(){
            const ind=document.getElementById('cc-save-indicator');if(ind)ind.textContent='● Salvando...';
            clearTimeout(timerSalvamento);timerSalvamento=setTimeout(salvarNoBanco,550);
        }
        document.addEventListener('input',e=>{
            if(e.target.id==='editor'||e.target.id==='input-titulo')solicitarSalvamento();
        });
        window.addEventListener('beforeunload',()=>{if(timerSalvamento){clearTimeout(timerSalvamento);salvarNoBanco()}});
        const selecionados = new Set();
        function atualizarLista() {
            const lista=document.getElementById('lista-projetos');
            let bd={};try { bd=JSON.parse(localStorage.getItem('meu_roteiro_bd')||'{}'); } catch(e) { console.warn(e); }
            lista.replaceChildren();
            for(const [id, p] of Object.entries(bd).reverse()) {
                const wrap=document.createElement('div');wrap.className='item-projeto-wrapper '+(p.tipo||'cinema')+' '+(id===idAtual?'ativo':'');
                const check=document.createElement('input');check.type='checkbox';check.className='cc-check';check.checked=selecionados.has(id);check.setAttribute('aria-label','Selecionar '+(p.titulo||'Sem título'));check.addEventListener('change',()=>{if(check.checked)selecionados.add(id);else selecionados.delete(id);atualizarBarraSelecao()});
                const open=document.createElement('button');open.className='cc-project-title';open.textContent=p.titulo||'Sem título';open.addEventListener('click',()=>carregar(id));
                const del=document.createElement('button');del.className='cc-small-delete';del.title='Excluir roteiro';del.textContent='×';del.addEventListener('click',()=>excluir(id));
                wrap.append(check,open,del);lista.append(wrap);
            }
            atualizarBarraSelecao();
        }
        function atualizarBarraSelecao(){
            const b=document.getElementById('cc-delete-selected');
            if(b){b.hidden=!selecionados.size;b.textContent='Excluir selecionados ('+selecionados.size+')';}
        }
        function excluirSelecionados(){
            if(!selecionados.size)return;
            if(!confirm('Excluir '+selecionados.size+' roteiro(s) selecionado(s) deste navegador?'))return;
            const bd=JSON.parse(localStorage.getItem('meu_roteiro_bd')||'{}');
            for(const id of selecionados)delete bd[id];
            try{localStorage.setItem('meu_roteiro_bd',JSON.stringify(bd));}catch(e){alert('Falha ao excluir: '+e.message);return;}
            const atualFoiExcluido=selecionados.has(idAtual);selecionados.clear();
            if(atualFoiExcluido){idAtual=null;document.getElementById('tela-editor').style.display='none';document.getElementById('tela-inicial').style.display='flex';}
            atualizarLista();
        }

        function excluir(id) {
            if(confirm("Apagar projeto?")) {
                let bd = JSON.parse(localStorage.getItem('meu_roteiro_bd') || '{}');
                delete bd[id];
                selecionados.delete(id);
                localStorage.setItem('meu_roteiro_bd', JSON.stringify(bd));
                atualizarLista();
                if (idAtual === id) {
                    document.getElementById('tela-editor').style.display = 'none';
                    document.getElementById('tela-inicial').style.display = 'flex';
                    idAtual = null;
                }
            }
        }

        function carregar(id) {
            const bd = JSON.parse(localStorage.getItem('meu_roteiro_bd') || '{}');
            idAtual = id;
            modoAtivo = bd[id].tipo;
            document.getElementById('tela-inicial').style.display = 'none';
            document.getElementById('tela-editor').style.display = 'flex';
            document.getElementById('editor').innerHTML = bd[id].conteudo;
            document.getElementById('editor').className = bd[id].classe;
            document.getElementById('input-titulo').value = bd[id].titulo;
            atualizarLista();
        }

        function renderizarBaixar() {
            const element = document.getElementById('editor');
            const opt = { 
                margin: [0.5, 0.5, 0.8, 0.5], 
                filename: (document.getElementById('input-titulo').value || 'Roteiro') + '.pdf', 
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#ffffff' }, 
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).toPdf().get('pdf').then(function (pdf) {
                var totalPages = pdf.internal.getNumberOfPages();
                for (var i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);
                    pdf.setFontSize(10);
                    pdf.setTextColor(150); 
                    pdf.text('Feito pelo MeuRoteiroFácil', 0.5, pdf.internal.pageSize.getHeight() - 0.4);
                    pdf.text('Página ' + i + ' de ' + totalPages, pdf.internal.pageSize.getWidth() - 1.5, pdf.internal.pageSize.getHeight() - 0.4);
                }
            }).save();
        }

        function baixarWord() {
            const titulo = document.getElementById('input-titulo').value || 'Roteiro';
            const conteudo = document.getElementById('editor').innerHTML;
            const css = `<style>body { font-family: 'Courier New', Courier, monospace; font-size: 12pt; }.personagem { text-align: center; text-transform: uppercase; margin-top: 25px; font-weight: bold; }.parenteses { text-align: center; font-style: italic; margin-left: 20%; margin-right: 20%; }.dialogo { margin: 0 15% 10px 15%; }.acao { margin-bottom: 12px; }.transicao { text-align: right; text-transform: uppercase; margin-top: 15px; margin-bottom: 15px; font-weight: bold; } table { width: 100%; border-collapse: collapse; } td { padding: 10px; vertical-align: top; }</style>`;
            const htmlCompleto = "<html><head><meta charset='utf-8'>" + css + "</head><body>" + conteudo + "</body></html>";
            const blob = new Blob(['\ufeff', htmlCompleto], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = titulo + '.doc';
            link.click();
        }

        window.onload=()=> {
            document.getElementById('tela-login').style.display='none';
            document.getElementById('tela-inicial').style.display='flex';
            document.getElementById('saudacao-user').textContent='ESTÚDIO DE ROTEIROS';
            atualizarLista();
        };
    </script>
<script>
/* Exportação nativa do roteiro: paginação A4, sem recortar tela longa. */
window.renderizarBaixar=function(){
 const ed=document.getElementById('editor'),titulo=document.getElementById('input-titulo').value||'Roteiro';
 if(!window.jspdf?.jsPDF){alert('Não foi possível carregar o gerador. Verifique a conexão e atualize.');return}
 try{
  salvarNoBanco();
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true}),maxY=273;
  let y=25;
  const font=(weight='normal',size=11)=>{pdf.setFont('courier',weight);pdf.setFontSize(size);pdf.setTextColor(32,29,26)};
  const newPage=()=>{pdf.addPage();y=25};
  const paragraph=(str,kind='acao')=>{
   let content=String(str||'').replace(/\s+/g,' ').trim();if(!content){y+=4;return}
   let x=25,w=160,align='left',gap=2,sz=11;
   if(kind==='personagem'){x=62;w=86;align='center';gap=7}
   if(kind==='dialogo'){x=53;w=105;gap=0}
   if(kind==='parenteses'){x=65;w=80;align='center';gap=0}
   if(kind==='transicao'){x=105;w=80;align='right';gap=7}
   if(kind==='scene'||kind==='header'){gap=8}
   const bold=['personagem','transicao','scene','header','section'].includes(kind);
   font(bold?'bold':'normal',sz);
   const lines=pdf.splitTextToSize(content,w);
   if(y+gap+Math.min(lines.length*5,20)>maxY)newPage();y+=gap;
   for(const line of lines){if(y+5>maxY)newPage();pdf.text(line,align==='center'?x+w/2:align==='right'?x+w:x,y,{align});y+=5}
   y+=2;
  };
  const table=(t)=>{
   const trs=[...t.querySelectorAll('tr')];let first=true;
   for(const tr of trs){
    const cells=[...tr.querySelectorAll('td,th')];if(!cells.length)continue;
    const left=(cells[0]?.innerText||cells[0]?.textContent||'').trim();
    const right=(cells[1]?.innerText||cells[1]?.textContent||'').trim();
    font(first?'bold':'normal',9.5);const A=pdf.splitTextToSize(left,72),B=pdf.splitTextToSize(right,72);
    const all=Math.max(A.length,B.length,1);let offset=0;
    while(offset<all){if(y+12>maxY)newPage();
      const lines=Math.max(1,Math.min(all-offset,Math.floor((maxY-y-9)/4.4)));
      pdf.setDrawColor(218,206,193);pdf.rect(25,y-3,160,lines*4.4+8);pdf.line(105,y-3,105,y+lines*4.4+5);
      pdf.text(A.slice(offset,offset+lines),29,y+2);pdf.text(B.slice(offset,offset+lines),109,y+2);
      y+=lines*4.4+11;offset+=lines;
    }first=false;
   }
  };
  for(const node of [...ed.children]){
    if(node.tagName==='TABLE'){table(node);continue}
    let klass=[...node.classList].find(Boolean)||'acao';
    if(node.tagName==='BR'){y+=4;continue}
    paragraph(node.innerText||node.textContent,klass);
  }
  for(let n=1;n<=pdf.getNumberOfPages();n++){pdf.setPage(n);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(141,122,104);pdf.text(titulo.substring(0,70),25,285);pdf.text(String(n),185,285,{align:'right'})}
  pdf.save(titulo.replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,70)+'.pdf');
 }catch(e){console.error(e);alert('Erro ao exportar: '+e.message)}
};
</script>
