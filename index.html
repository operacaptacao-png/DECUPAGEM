px}.project-link.active{background:#315247;color:#fff}.sidebar-bottom{font-size:11px;line-height:1.7;color:#bbcfc6;margin-top:auto;border-top:1px solid #42594f;padding:18px 6px 0}.sidebar-bottom small{color:#819e91}.side-dot{color:#74d3a2;font-size:14px;margin-right:6px}.workspace{min-width:0;flex:1}.topbar{background:#fff;min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px 37px;gap:15px;position:sticky;top:0;z-index:4}.crumb{font-size:11px;font-weight:650;letter-spacing:.8px;color:#8a9a93}.crumb span{margin:0 12px;color:#c1cec7}.crumb b{color:#273e32}.header-actions{display:flex;align-items:center;gap:12px}.save-indicator{color:#4b816d;font-size:11px;white-space:nowrap}.primary-btn,.outline-btn,.danger-btn,.subtle-btn,.square-btn{border:1px solid transparent;border-radius:10px;padding:11px 16px;font-size:12px;font-weight:750}.primary-btn{background:var(--accent);color:#fff}.primary-btn:hover{background:#175447}.outline-btn{background:#fff;color:#233a30;border-color:#cfdcd3}.outline-btn:hover{background:#f3f7f3}.subtle-btn{background:#eef3ef;color:#1d5545}.danger-btn{background:#fff4f1;border-color:#f7dbd6;color:#a7412d}.square-btn{background:#fff;border-color:#dce4dd;color:#536e5f;padding:8px 10px}.main{max-width:1350px;margin:0 auto;padding:39px 44px 75px}.eyebrow{display:block;color:#1c7560;font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:9px}.section-title{font-size:32px;letter-spacing:-1.1px;line-height:1.17;margin:0}.section-caption{color:var(--muted);font-size:13px;line-height:1.7;margin:12px 0 0}.intro-row,.section-row{display:flex;justify-content:space-between;align-items:center;gap:20px}.section-row{margin:32px 0 16px}.section-row h2{font-size:21px;margin:0;letter-spacing:-.5px}.section-row p{font-size:12px;color:var(--muted);margin:5px 0 0}.project-meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px;margin:28px 0 8px}.panel{border: pper{overflow-x:auto}.day-footer{margin-top:14px;display:flex;justify-content:flex-start}.welcome{display:flex;align-items:center;justify-content:space-between;gap:35px;min-height:390px}.welcome h1{font-size:clamp(36px,4vw,58px);letter-spacing:-2.5px;line-height:1.05;max-width:640px;margin:7px 0 18px}.welcome p{font-size:14px;max-width:500px;color:#64796c;line-height:1.9;margin-bottom:27px}.welcome-art{min-width:250px;width:330px;height:310px;border-radius:24px;background:#e2ede5;display:grid;place-items:center;position:relative;overflow:hidden}.art-sheet{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:194px;height:205px;padding:15px;transform:rotate(-7deg);display:flex;flex-direction:column;gap:10px}.art-bar{height:11px;background:#cfe3d4;border-radius:5px}.art-bar:nth-child(2){width:70%}.art-frame{background:#285b4b;border-radius:8px;height:95px}.welcome-shortcuts{display:flex;gap:12px;margin-top:15px}.small-footer{margin-top:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mobile-menu{display:none}.toast{position:fixed;bottom:24px;right:24px;background:#173e30;color:#fff;padding:15px 20px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:99;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.modal{position:fixed;inset:0;background:#101e19c5;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal-box{width:min(420px,100%);background:white;border-radius:18px;padding:25px}.modal-box h2{margin:0 0 6px;font-size:21px}.modal-box p{font-size:12px;color:var(--muted);line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}.image-viewer{position:fixed;inset:0;background:#0e1712e8;z-index:60;display:grid;place-items:center;padding:40px}.image-viewer img{max-width:95vw;max-height:85vh;object-fit:contain}.close-viewer{position:absolute;right:20px;top:20px;background:#fff;border:0;padding:9px 13px;border-radius:7px}.pdf-root{width:775px;padding:30px;color:#172724;background:#fff;font:13px/1.45 Arial,sans-serif}.pdf-cover{border-bottom:3px solid #1c6d5b;padding-bottom:15px;margin-bottom:19px}.pdf-kicker{font-size:10px;color:#1c6d5b;font-weight:700;letter-spacing:2px}.pdf-root h1{font-size:27px;margin:5px 0 7px}.pdf-root h2{font-size:18px;margin:22px 0 10px}.pdf-root h3{font-size:14px;margin:0}.pdf-meta{font-size:11px;color:#566e5f}.pdf-scene{border:1px solid #dfe6e1;border-radius:7px;padding:13px;margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}.pdf-scene-head{background:#edf5ef;padding:8px 9px;margin:-13px -13px 12px;display:flex;align-items:center;gap:12px;font-weight:bold}.pdf-scene-head span{color:#fff;background:#1c6d5b;padding:6px 9px;border-radius:4px}.pdf-scene .pdf-photogrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.pdf-photo img{width:100%;max-height:188px;object-fit:contain;background:#f1f3f0;display:block}.pdf-photo small{font-size:9px;display:block;margin-top:4px;color:#626e65}.pdf-info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pdf-detail{font-size:11px;border-top:1px solid #e6ebe5;padding-top:6px;white-space:pre-wrap}.pdf-detail b{color:#1c6d5b;font-size:9px;letter-spacing:.5px;display:block;margin-bottom:3px}.pdf-detail.wide{grid-column:span 2}.pdf-day{break-inside:avoid;page-break-inside:avoid;margin:12px 0 25px}.pdf-day .pdf-day-meta{font-size:11px;color:#4f6858;margin:7px 0}.pdf-table{width:100%;border-collapse:collapse;font-size:10px}.pdf-table th,.pdf-table td{border:1px solid #dbe5dd;padding:7px;text-align:left;vertical-align:top}.pdf-table th{background:#ebf2ed}.print-root{display:none}@media(max-width:1200px){.scene-grid{grid-template-columns:1fr}.photo-list{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.sidebar{position:fixed;transform:translateX(-105%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.topbar{padding:13px 17px}.save-indicator{display:none}.main{padding:25px 17px 65px}.welcome-art{display:none}.project-meta{grid-template-columns:1fr 1fr}.meta-grid{grid-template-columns:1fr 1fr}.meta-main{grid-column:span 2}}@media(max-width:570px){.topbar{min-height:68px}.header-actions{gap:6px}.outline-btn,.primary-btn{padding:9px 10px;font-size:11px}.crumb{font-size:10px}.scene-body{padding:11px}.scene-top{padding:12px}.fields-grid{grid-template-columns:1fr}.fields-grid .span2{grid-column:1}.photo-list{grid-template-columns:repeat(2,1fr)}.day-meta{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr}.meta-main{grid-column:1}.section-title{font-size:27px}.section-row{align-items:flex-start}.section-row h2{font-size:18px}.tab{padding:12px;font-size:12px}.scene-left h3{font-size:13px}.toolrow{gap:2px}.square-btn{padding:7px}.day-header{align-items:flex-start}}@media print{body{background:white}#shell,#toast,.modal,.image-viewer{display:none!important}.print-root{display:block!important}.pdf-root{width:100%!important;padding:0!important}.pdf-scene{break-inside:avoid;page-break-inside:avoid}@page{size:A4;margin:13mm}}

  <script type="module">
(() => {
'use strict';
const DB_NAME='decupa-projects-v1',STORE='projects';
const $=sel=>document.querySelector(sel);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));
const displayDate=d=>{if(!d)return 'Data a definir';const [y,m,day]=d.split('-');return day&&m&&y?`${day}/${m}/${y}`:d};
let db,projects=[],active=null,tab='scenes',photoScene=null,saveTimer=null,saveStateTimer=null,toastTimer=null;
const sceneBlank=()=>({id:uid(),title:'',location:'',action:'',framing:'',needs:'',notes:'',photos:[]});
const dayBlank=()=>({id:uid(),title:'Ordem do dia',date:'',location:'',rows:[]});
const rowBlank=()=>({id:uid(),start:'',end:'',scenes:'',activity:'',location:'',people:''});
const projectBlank=title=>({id:uid(),title:title||'Novo projeto',production:'',director:'',date:'',location:'',scenes:[],days:[],createdAt:Date.now(),updatedAt:Date.now()});
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});}
function storeAction(type,item){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');const obj=tx.objectStore(STORE);const req=type==='delete'?obj.delete(item):obj.put(item);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error);});}
function readAll(){return new Promise((resolve,reject)=>{const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});}
function alertToast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300);}
function showSave(s){$('#save-indicator').textContent=s;}
async function persist(){if(!active)return;try{active.updatedAt=Date.now();await storeAction('put',active);showSave('● Salvo');clearTimeout(saveStateTimer);saveStateTimer=setTimeout(()=>showSave('● Pronto'),2200);}catch(err){showSave('● Erro ao salvar');alertToast('Não foi possível salvar. Exporte um backup.');console.error(err);}}
function scheduleSave(){showSave('● Salvando...');clearTimeout(saveTimer);saveTimer=setTimeout(persist,320)}
function findScene(id){return active?.scenes.find(s=>s.id===id)}
function findDay(id){return active?.days.find(d=>d.id===id)}
function renumber(i){return String(i+1).padStart(2,'0')}
function sideRender(){const nav=$('#projects');const sorted=[...projects].sort((a,b)=>b.updatedAt-a.updatedAt);nav.innerHTML=sorted.map(p=>`<button class="project-link ${p.id===active?.id?'active':''}" data-act="open-project" data-id="${esc(p.id)}"><span class="project-icon">▤</span><span><b>${esc(p.title||'Sem título')}</b><small>${p.scenes.length} ${p.scenes.length===1?'cena':'cenas'}</small></span></button>`).join('')||'<p class="note" style="color:#abc0b6;padding:0 12px">Nenhum projeto ainda.</p>'}
function sectionEmpty(icon,title,text,button,action){return `<div class="empty-state"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${text}</p><button class="primary-btn" data-act="${action}">＋ ${button}</button></div>`}
function welcome(){return `<section class="welcome"><div><span class="eyebrow">SEU ESPAÇO DE PRÉ-PRODUÇÃO</span><h1>Da ideia ao set.<br>Plano por plano.</h1><p>Organize suas cenas, reúna imagens de referência e prepare as ordens do dia. Comece um projeto em branco e, ao final, exporte a decupagem em PDF.</p><button class="primary-btn" data-act="new-project">＋ Criar meu primeiro projeto</button><div class="welcome-shortcuts"><button class="outline-btn" data-act="import-json">↑ Importar backup</button></div></div><div class="welcome-art" aria-hidden="true"><div class="art-sheet"><div class="art-bar"></div><div class="art-bar"></div><div class="art-frame"></div><div class="art-bar"></div><div class="art-bar"></div></div></div></section>`}
function field(label,value,scope,id,key,opts={}){const input=opts.single?`<input type="${opts.type||'text'}" value="${esc(value)}" data-scope="${scope}" data-id="${esc(id||'')}" data-field="${key}" placeholder="${esc(opts.placeholder||'')}" />`:`<textarea rows="${opts.rows||2}" data-scope="${scope}" data-id="${esc(id||'')}" data-field="${key}" placeholder="${esc(opts.placeholder||'')}">${esc(value)}</textarea>`;return `<div class="field ${opts.className||''}"><label>${label}</label>${input}</div>`;}
function metaRender(){return `<div class="panel meta-panel"><div class="meta-grid">${field('Título do projeto',active.title,'project','', 'title',{single:true,className:'meta-main',placeholder:'Nome da produção'})}${field('Produção / equipe',active.production,'project','','production',{single:true,placeholder:'Nome da produção'})}${field('Direção',active.director,'project','','director',{single:true,placeholder:'Nome do responsável'})}${field('Data prevista',active.date,'project','','date',{single:true,type:'date'})}${field('Locação geral',active.location,'project','','location',{single:true,className:'meta-main',placeholder:'Cidade ou local de filmagem (opcional)'})}</div></div>`}
function photosRender(s){return s.photos.length?`<div class="photo-list">${s.photos.map((photo,i)=>`<div class="photo-item"><img src="${photo.data}" data-act="zoom-image" data-id="${s.id}" data-index="${i}" alt="Referência ${i+1} da cena"><button class="remove-photo" data-act="remove-photo" data-id="${s.id}" data-index="${i}" title="Remover fotografia">×</button><input aria-label="Legenda da fotografia" placeholder="Legenda (opcional)" value="${esc(photo.caption)}" data-scope="photo" data-id="${s.id}" data-index="${i}" data-field="caption"></div>`).join('')}</div>`:`<div class="empty-photo"><span style="font-size:30px">▧</span><strong>Sem imagens de referência</strong><span>Adicione fotos ou fotogramas</span></div>`}
function sceneRender(s,i){return `<article class="panel scene-card" id="scene-${esc(s.id)}"><div class="scene-top"><div class="scene-left"><span class="scene-number">${renumber(i)}</span><div><h3>Cena ${renumber(i)}</h3><p>${esc(s.title||'Sem título')}</p></div></div><div class="toolrow"><button class="square-btn" data-act="scene-up" data-id="${s.id}" title="Subir cena" ${i===0?'disabled':''}>↑</button><button class="square-btn" data-act="scene-down" data-id="${s.id}" title="Descer cena" ${i===active.scenes.length-1?'disabled':''}>↓</button><button class="square-btn" data-act="scene-duplicate" data-id="${s.id}" title="Duplicar cena">⧉</button><button class="square-btn" data-act="scene-delete" data-id="${s.id}" title="Excluir cena">✕</button></div></div><div class="scene-body"><div class="scene-grid"><div class="fields-grid">${field('Nome / identificação',s.title,'scene',s.id,'title',{single:true,className:'span2',placeholder:'Ex.: Chegada ao edifício'})}${field('Ação da cena',s.action,'scene',s.id,'action',{className:'span2',rows:3,placeholder:'O que acontece nesta cena?'})}${field('Enquadramento e movimento',s.framing,'scene',s.id,'framing',{className:'span2',placeholder:'Plano, posição e movimentação da câmera'})}${field('Locação indicada',s.location,'scene',s.id,'location',{single:true,placeholder:'Ex.: Recepção'})}${field('Necessidades',s.needs,'scene',s.id,'needs',{placeholder:'Objetos, elenco, figurino...'})}${field('Descrição complementar',s.notes,'scene',s.id,'notes',{className:'span2',rows:2,placeholder:'Observações adicionais, se necessário'})}</div><div class="photo-area"><div class="photo-head"><b>REFERÊNCIAS FOTOGRÁFICAS <span style="color:#9aada0">(${s.photos.length})</span></b><button class="subtle-btn" data-act="add-photo" data-id="${s.id}">＋ Foto</button></div>${photosRender(s)}</div></div></div></article>`}
function dayRender(day,i){return `<section class="panel day-card" id="day-${day.id}"><div class="day-header"><h3>ORDEM DO DIA ${String(i+1).padStart(2,'0')}</h3><button class="danger-btn" data-act="delete-day" data-id="${day.id}">Excluir OD</button></div><div class="day-meta">${field('Identificação',day.title,'day',day.id,'title',{single:true,placeholder:'Ex.: Diária 01'})}${field('Data',day.date,'day',day.id,'date',{single:true,type:'date'})}${field('Locação / endereço',day.location,'day',day.id,'location',{single:true,placeholder:'Local da gravação'})}</div><div class="schedule-wrapper"><table class="schedule-table"><thead><tr><th style="width:10%">INÍCIO</th><th style="width:10%">FIM</th><th style="width:11%">CENAS</th><th style="width:28%">ATIVIDADE</th><th style="width:20%">LOCAÇÃO</th><th style="width:17%">PARTICIPANTES</th><th></th></tr></thead><tbody>${day.rows.length?day.rows.map(r=>`<tr>${['start','end','scenes','activity','location','people'].map(k=>`<td><input aria-label="${k}" value="${esc(r[k])}" data-scope="od-row" data-id="${day.id}" data-row="${r.id}" data-field="${k}" ${k==='start'||k==='end'?'placeholder="13:00"':''}></td>`).join('')}<td><button class="square-btn" title="Excluir horário" data-act="remove-row" data-id="${day.id}" data-row="${r.id}">×</button></td></tr>`).join(''):`<tr><td colspan="7" class="note" style="padding:16px">Sem horários cadastrados.</td></tr>`}</tbody></table></div><div class="day-footer"><button class="subtle-btn" data-act="add-row" data-id="${day.id}">＋ Adicionar horário</button></div></section>`}
function projectRender(){const n=active.scenes.length;$('#main').innerHTML=`<section class="intro-row"><div><span class="eyebrow">PROJETO AUDIOVISUAL</span><h1 class="section-title">${esc(active.title||'Sem título')}</h1><p class="section-caption">Sua decupagem visual, do primeiro plano à ordem do dia.</p></div><button class="danger-btn" data-act="delete-project" title="Excluir este projeto">Excluir projeto</button></section><div class="section-row"><div><h2>Informações do projeto</h2><p>Identificação que aparecerá no PDF.</p></div></div>${metaRender()}<div class="tabs"><button class="tab ${tab==='scenes'?'active':''}" data-act="tab-scene">Decupagem <span style="opacity:.6">(${n})</span></button><button class="tab ${tab==='days'?'active':''}" data-act="tab-day">Ordens do dia <span style="opacity:.6">(${active.days.length})</span></button></div><section id="tab-content">${tab==='scenes'?scenesSection():daysSection()}</section><div class="small-footer"><button class="outline-btn" data-act="import-json">↑ Importar backup</button><span class="note">Os projetos ficam armazenados neste navegador; exporte backups regularmente.</span></div>`;}
function scenesSection(){return `<div class="section-row"><div><h2>Cenas do projeto</h2><p>Organize as cenas e adicione as imagens que desejar.</p></div><button class="primary-btn" data-act="add-scene">＋ Nova cena</button></div><div class="scene-list">${active.scenes.length?active.scenes.map(sceneRender).join(''):sectionEmpty('▥','Nenhuma cena cadastrada','Este projeto está vazio. Crie sua primeira cena para começar a decupagem.','Criar primeira cena','add-scene')}</div>`}
function daysSection(){return `<div class="section-row"><div><h2>Ordens do dia</h2><p>Organize os horários e locações. Esta seção aparece ao final do PDF.</p></div><button class="primary-btn" data-act="add-day">＋ Nova OD</button></div><div class="days-list">${active.days.length?active.days.map(dayRender).join(''):sectionEmpty('◷','Nenhuma ordem do dia','Adicione uma ou mais diárias para organizar as gravações.','Criar ordem do dia','add-day')}</div>`}
function render(){sideRender();$('#top-project').textContent=active?.title||'Seus projetos';$('#backup-btn').hidden=!active;$('#pdf-btn').hidden=!active;if(active)projectRender();else $('#main').innerHTML=welcome();}
function selectProject(id){clearTimeout(saveTimer);active=projects.find(p=>p.id===id)||null;localStorage.setItem('decupa-current-project',active?.id||'');tab='scenes';render();$('#sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});}
function showCreateDialog(){const modal=document.createElement('div');modal.className='modal';modal.id='create-modal';modal.innerHTML=`<form class="modal-box" id="new-form"><h2>Novo projeto</h2><p>Comece com uma decupagem em branco. Nenhuma cena de exemplo será adicionada.</p><div class="field"><label for="project-name">NOME DO PROJETO</label><input id="project-name" placeholder="Ex.: Curta-metragem, clipe, campanha" maxlength="120" required autofocus></div><div class="modal-actions"><button class="outline-btn" type="button" data-act="close-modal">Cancelar</button><button class="primary-btn" type="submit">Criar projeto</button></div></form>`;document.body.appendChild(modal);$('#project-name').focus();$('#new-form').addEventListener('submit',async e=>{e.preventDefault();const title=$('#project-name').value.trim();if(!title)return;const p=projectBlank(title);projects.push(p);await storeAction('put',p);modal.remove();selectProject(p.id);alertToast('Projeto criado. Agora adicione suas cenas.');});}
async function createPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Não foi possível abrir a imagem'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Formato de imagem inválido'));img.onload=()=>{const maxWidth=1500,maxHeight=1100,scale=Math.min(1,maxWidth/img.width,maxHeight/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve({id:uid(),data:canvas.toDataURL('image/jpeg',.79),caption:''});};img.src=reader.result;};reader.readAsDataURL(file);});}
function downloadBlob(content,file,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function safeName(s){return(s||'projeto').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,64)||'projeto'}
function pdfField(label,value,wide=false){return value?.trim()?`<div class="pdf-detail ${wide?'wide':''}"><b>${esc(label)}</b>${esc(value)}</div>`:''}
function pdfHtml(){const p=active;const sceneHtml=p.scenes.map((s,i)=>`<div class="pdf-scene"><div class="pdf-scene-head"><span>${renumber(i)}</span><h3>${esc(s.title||`Cena ${renumber(i)}`)}</h3></div>${s.photos.length?`<div class="pdf-photogrid">${s.photos.map(ph=>`<div class="pdf-photo"><img src="${ph.data}" alt="Referência visual"><small>${esc(ph.caption)}</small></div>`).join('')}</div>`:''}<div class="pdf-info">${pdfField('AÇÃO',s.action,true)}${pdfField('ENQUADRAMENTO / MOVIMENTO',s.framing,true)}${pdfField('LOCAÇÃO INDICADA',s.location)}${pdfField('NECESSIDADES',s.needs)}${pdfField('DESCRIÇÃO COMPLEMENTAR',s.notes,true)}</div></div>`).join('');const daysHtml=p.days.map((d,i)=>`<div class="pdf-day"><h3>${esc(d.title||`Ordem do dia ${i+1}`)}</h3><div class="pdf-day-meta">${esc(displayDate(d.date))} · ${esc(d.location||'Locação a definir')}</div><table class="pdf-table"><thead><tr><th>INÍCIO</th><th>FIM</th><th>CENAS</th><th>ATIVIDADE</th><th>LOCAÇÃO</th><th>PARTICIPANTES</th></tr></thead><tbody>${d.rows.map(r=>`<tr>${['start','end','scenes','activity','location','people'].map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="6">Sem horários cadastrados</td></tr>'}</tbody></table></div>`).join('');return `<div class="pdf-root"><div class="pdf-cover"><span class="pdf-kicker">DECUPAGEM VISUAL · PLANEJAMENTO AUDIOVISUAL</span><h1>${esc(p.title)}</h1><div class="pdf-meta">${[p.production,p.director?'Direção: '+p.director:'',p.date?'Data: '+displayDate(p.date):'',p.location].filter(Boolean).map(esc).join(' · ')}</div></div><h2>Decupagem · ${p.scenes.length} ${p.scenes.length===1?'cena':'cenas'}</h2>${sceneHtml||'<p>Nenhuma cena cadastrada.</p>'}${p.days.length?`<div style="page-break-before:always;break-before:page"><h2>Ordens do dia</h2>${daysHtml}</div>`:''}<p style="font-size:9px;color:#88958a;margin-top:20px">Documento gerado no DECUPA · ${new Date().toLocaleDateString('pt-BR')}</p></div>`}
async function exportPdf(){if(!active)return;const btn=$('#pdf-btn');const label=btn.textContent;btn.disabled=true;btn.textContent='Preparando PDF...';try{await persist();if(!window.DecupaPdf?.create)throw new Error('Gerador de PDF não carregou. Atualize a página.');window.DecupaPdf.create(active,safeName);alertToast('PDF gerado em A4 horizontal.');}catch(e){console.error('Erro ao gerar PDF:',e);alertToast('Não foi possível gerar o PDF: '+(e.message||'erro desconhecido'));}finally{btn.disabled=false;btn.textContent=label;}}
function printFallback(){const print=$('#print-pdf-root');if(print)print.remove();const el=document.createElement('div');el.id='print-pdf-root';el.className='print-root';el.innerHTML=pdfHtml();document.body.append(el);setTimeout(()=>{window.print();setTimeout(()=>el.remove(),2500)},250)}
function screenshotZoom(s,i){const src=s?.photos[+i]?.data;if(!src)return;const node=document.createElement('div');node.className='image-viewer';node.innerHTML=`<button class="close-viewer" data-act="close-viewer">Fechar ✕</button><img src="${src}" alt="Referência ampliada">`;document.body.append(node);node.addEventListener('click',e=>{if(e.target===node)node.remove()});}
async function applyAction(btn){const a=btn.dataset.act,id=btn.dataset.id,rowId=btn.dataset.row;
if(a==='new-project')return showCreateDialog();if(a==='close-modal')return $('#create-modal')?.remove();if(a==='close-viewer')return $('.image-viewer')?.remove();if(a==='menu')return $('#sidebar').classList.toggle('open');if(a==='open-project')return selectProject(id);if(a==='import-json')return $('#import-input').click();if(a==='tab-scene'||a==='tab-day'){tab=a==='tab-scene'?'scenes':'days';render();return;}if(!active)return;
if(a==='add-scene'){const s=sceneBlank();active.scenes.push(s);scheduleSave();render();document.getElementById('scene-'+s.id)?.scrollIntoView({behavior:'smooth',block:'center'});return}
if(a==='scene-delete'){if(!confirm('Excluir esta cena e suas fotografias?'))return;active.scenes=active.scenes.filter(s=>s.id!==id);scheduleSave();render();return}
if(a==='scene-duplicate'){const idx=active.scenes.findIndex(s=>s.id===id);if(idx<0)return;const copy=JSON.parse(JSON.stringify(active.scenes[idx]));copy.id=uid();copy.title=(copy.title||'Cena')+' (cópia)';copy.photos=copy.photos.map(ph=>({...ph,id:uid()}));active.scenes.splice(idx+1,0,copy);scheduleSave();render();return}
if(a==='scene-up'||a==='scene-down'){const idx=active.scenes.findIndex(s=>s.id===id),next=idx+(a==='scene-up'?-1:1);if(idx<0||next<0||next>=active.scenes.length)return;[active.scenes[idx],active.scenes[next]]=[active.scenes[next],active.scenes[idx]];scheduleSave();render();return}
if(a==='add-photo'){photoScene=id;$('#photo-input').value='';$('#photo-input').click();return}
if(a==='remove-photo'){const s=findScene(id);if(!s)return;s.photos.splice(+btn.dataset.index,1);scheduleSave();render();return}
if(a==='zoom-image')return screenshotZoom(findScene(id),btn.dataset.index);
if(a==='add-day'){const d=dayBlank();active.days.push(d);tab='days';scheduleSave();render();document.getElementById('day-'+d.id)?.scrollIntoView({behavior:'smooth',block:'center'});return}
if(a==='delete-day'){if(!confirm('Excluir esta ordem do dia?'))return;active.days=active.days.filter(d=>d.id!==id);scheduleSave();render();return}
if(a==='add-row'){const d=findDay(id);if(!d)return;d.rows.push(rowBlank());scheduleSave();render();return}
if(a==='remove-row'){const d=findDay(id);if(!d)return;d.rows=d.rows.filter(r=>r.id!==rowId);scheduleSave();render();return}
if(a==='export-json'){await persist();const name=`Backup_Decupa_${safeName(active.title)}.json`;downloadBlob(JSON.stringify({application:'DECUPA',version:1,exportedAt:new Date().toISOString(),project:active},null,2),name,'application/json;charset=utf-8');alertToast('Backup exportado.');return}
if(a==='export-pdf')return exportPdf();
if(a==='delete-project'){if(!confirm(`Excluir definitivamente o projeto "${active.title}" deste navegador?`))return;const old=active;await storeAction('delete',old.id);projects=projects.filter(p=>p.id!==old.id);selectProject(projects[0]?.id);alertToast('Projeto excluído.');return}
}
function inputHandler(e){const n=e.target;if(!n.dataset.field||!active)return;const k=n.dataset.field,val=n.value,scope=n.dataset.scope,id=n.dataset.id;let target;if(scope==='project')target=active;else if(scope==='scene')target=findScene(id);else if(scope==='day')target=findDay(id);else if(scope==='od-row')target=findDay(id)?.rows.find(r=>r.id===n.dataset.row);else if(scope==='photo')target=findScene(id)?.photos[+n.dataset.index];if(!target)return;target[k]=val;scheduleSave();if(scope==='project'&&k==='title'){$('#top-project').textContent=val||'Sem título';$('.section-title').textContent=val||'Sem título';const item=[...document.querySelectorAll('.project-link')].find(b=>b.dataset.id===active.id);if(item)item.querySelector('b').textContent=val||'Sem título';}if(scope==='scene'&&k==='title'){n.closest('.scene-card').querySelector('.scene-left p').textContent=val||'Sem título';}}
async function loadImport(file){try{if(file.size>35*1024*1024)throw Error('Arquivo de backup muito grande');const raw=JSON.parse(await file.text());let p=raw.project;if(raw.application!=='DECUPA'||!p||!Array.isArray(p.scenes)||!Array.isArray(p.days))throw Error('Formato de backup inválido');if(p.scenes.some(s=>!Array.isArray(s.photos))||p.days.some(d=>!Array.isArray(d.rows)))throw Error('Estrutura inválida');p=JSON.parse(JSON.stringify(p));p.id=uid();p.title=String(p.title||'Projeto importado')+' (importado)';p.updatedAt=Date.now();p.createdAt=Date.now();for(const s of p.scenes){s.id=uid();for(const ph of s.photos)ph.id=uid()}for(const d of p.days){d.id=uid();for(const r of d.rows)r.id=uid()}await storeAction('put',p);projects.push(p);selectProject(p.id);alertToast('Backup importado em um novo projeto.');}catch(err){alertToast('Não foi possível importar: '+(err.message||'arquivo inválido'));console.error(err);}}
async function photoHandler(input){const s=findScene(photoScene);if(!s)return;const files=[...input.files||[]];if(!files.length)return;let okay=0;for(const f of files){try{if(f.size>20*1024*1024)throw new Error('Arquivo muito grande');if(!f.type.startsWith('image/'))throw new Error('Formato inválido');const ph=await createPhoto(f);s.photos.push(ph);okay++;}catch(e){console.warn(e);alertToast(`Imagem ignorada: ${f.name}`);}}if(okay){try{await persist();render();alertToast(`${okay} ${okay===1?'fotografia adicionada':'fotografias adicionadas'}.`)}catch(e){alertToast('Erro ao salvar fotografias.')}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();applyAction(b).catch(err=>{console.error(err);alertToast('Algo deu errado ao executar esta ação.')})}});
document.addEventListener('input',inputHandler);
$('#photo-input').addEventListener('change',e=>photoHandler(e.target));
$('#import-input').addEventListener('change',async e=>{const file=e.target.files[0];if(file)await loadImport(file);e.target.value=''});
window.addEventListener('beforeunload',()=>{if(active&&saveTimer){clearTimeout(saveTimer);persist();}});
(async()=>{try{db=await openDB();projects=await readAll();const selected=localStorage.getItem('decupa-current-project');active=projects.find(p=>p.id===selected)||projects.sort((a,b)=>b.updatedAt-a.updatedAt)[0]||null;render();}catch(e){console.error(e);$('#main').innerHTML='<div class="empty-state"><h3>Não foi possível iniciar o armazenamento</h3><p>Habilite o armazenamento do navegador para usar o aplicativo.</p></div>'}})();
})();

  </script>
</head>
<body>
<div class="app-shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">▦</div><div><strong>DECUPA</strong><span>Planejamento audiovisual</span></div></div>
    <button class="new-project" data-act="new-project"><span>＋</span> Novo projeto</button>
    <p class="aside-label">MEUS PROJETOS</p>
    <nav id="projects" class="projects-list" aria-label="Projetos"></nav>
    <div class="sidebar-bottom"><span class="side-dot"></span> Dados salvos neste navegador<br><small>Use o backup para trocar de dispositivo.</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button class="mobile-menu icon-btn" data-act="menu" aria-label="Abrir menu">☰</button>
      <div class="crumb">PRODUÇÃO <span> / </span> <b id="top-project">Seus projetos</b></div>
      <div class="header-actions"><span class="save-indicator" id="save-indicator">● Pronto</span><button class="outline-btn" id="backup-btn" data-act="export-json" hidden>Backup JSON</button><button class="primary-btn" id="pdf-btn" data-act="export-pdf" hidden>↓ Exportar PDF</button></div>
    </header>
    <main id="main" class="main"></main>
  </div>
</div>
<input type="file" id="photo-input" accept="image/png,image/jpeg,image/webp,image/avif" multiple hidden>
<input type="file" id="import-input" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
